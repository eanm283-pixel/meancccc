name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 project.zip
        run: |
          if [ ! -f project.zip ]; then echo "请先上传 project.zip 再运行"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 组件
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 解压工程
        run: unzip -q -o project.zip

      - name: 安装 Gradle 8.2
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: 编译 APK
        run: cd android && gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
