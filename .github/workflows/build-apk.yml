name: Build APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: 检查 project.zip
        run: |
          if [ ! -f project.zip ]; then echo "请先上传 project.zip 再运行"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK 目录: $SDK"
          SDKM=$(find "$SDK/cmdline-tools" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: 固定签名（首次自动生成并提交）
        run: |
          KS=android/keystore.jks
          if [ -f "$KS" ]; then
            echo "已有固定签名，直接使用"
          else
            echo "首次构建：生成固定签名并提交回仓库"
            mkdir -p android
            keytool -genkeypair -v -keystore "$KS" -storetype JKS \
              -storepass diary2026 -alias diary -keypass diary2026 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Diary, O=Personal, C=CN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KS"
            git commit -m "chore: 添加固定签名密钥（用于覆盖安装）"
            git push
          fi

      - name: 解压工程
        run: unzip -q -o project.zip

      - name: 清理 BOM（保险）
        run: |
          cat > /tmp/fixbom.py <<'PY'
          import pathlib
          for p in pathlib.Path("android").rglob("*"):
              if p.is_file() and p.suffix.lower() in {".java", ".xml", ".kts", ".properties"}:
                  b = p.read_bytes()
                  if b.startswith(b"\xef\xbb\xbf"):
                      p.write_bytes(b[3:])
                      print("已清理 BOM:", p)
          PY
          python3 /tmp/fixbom.py

      - name: 安装 Gradle 8.2
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: 编译 APK
        run: cd android && gradle assembleDebug --no-daemon --stacktrace

      - name: 重命名 APK
        run: |
          cd android/app/build/outputs/apk/debug
          cp app-debug.apk "时光手记-v1.0.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: 时光手记-v1.0
          path: android/app/build/outputs/apk/debug/时光手记-v1.0.apk
          if-no-files-found: error
